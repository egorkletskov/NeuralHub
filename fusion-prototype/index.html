function filterCount(){let n=state.filters.brands.length+state.filters.sizes.length+(state.filters.maxPrice<100000?1:0)+(state.filters.inStock?1:0)+(state.filters.sort!=='featured'?1:0);return n}
function filteredProducts(){let list=[...products];if(state.category!=='Все')list=list.filter(p=>p.cat===state.category);const q=(state.query||'').trim().toLowerCase();if(q)list=list.filter(p=>(p.brand+' '+p.name+' '+p.cat).toLowerCase().includes(q));if(state.filters.brands.length)list=list.filter(p=>state.filters.brands.includes(p.brand));if(state.filters.sizes.length)list=list.filter(p=>p.sizes.some(s=>state.filters.sizes.includes(s)));list=list.filter(p=>p.price<=state.filters.maxPrice);if(state.filters.inStock)list=list.filter(p=>(state.stocks[p.id]||0)>0);if(state.filters.sort==='priceAsc')list.sort((a,b)=>a.price-b.price);if(state.filters.sort==='priceDesc')list.sort((a,b)=>b.price-a.price);return list}
function catalog(){const list=filteredProducts();const fc=filterCount();return `${topbar()}<div class="page-title"><div class="kicker">Каталог</div><h1>Все вещи</h1></div><div class="searchline"><label class="searchbox">${I.search}<input value="${state.query||''}" placeholder="Бренд, модель, категория" oninput="setSearch(this.value)"></label><button class="filterbtn" onclick="openFilters()">${I.tune}${fc?`<span class="filter-dot">${fc}</span>`:''}</button></div><div class="chips">${categories.map(n=>`<button class="chip ${state.category===n?'active':''}" onclick="setCategory('${n}',true)">${n}</button>`).join('')}</div><div class="result-meta"><span id="resultCount">${list.length} ${list.length===1?'товар':'товаров'}</span><button onclick="openFilters()">Фильтры${fc?` · ${fc}`:''}</button></div><section class="section"><div id="catalogGrid" class="products">${list.length?list.map(productCard).join(''):`<div class="empty" style="grid-column:1/-1;padding:56px 18px"><b>Ничего не найдено</b>Сбросьте часть фильтров или измените запрос.</div>`}</div></section>`}
function detail(){const p=products.find(x=>x.id===state.selected)||products[0];if(!p.sizes.includes(state.size))state.size=p.sizes[0];const inStock=state.stocks[p.id]||0;return `<div class="detail-media"><img src="${p.photo}" alt="${p.name}"><button class="floating-back" onclick="goShop('catalog')">${I.back}</button><button class="floating-heart" onclick="toast('В избранное')">${I.heart}</button></div><div class="detail-body"><div class="detail-line"><div><h1 class="detail-title">${p.name}</h1><div class="detail-brand">${p.brand}</div></div><div class="detail-price">${money(p.price)}</div></div><p class="detail-desc">Чистая карточка товара для Telegram Mini App: размер, актуальный остаток и оформление без лишних шагов.</p><div class="option-label"><b>Размер</b><span>${inStock?'В наличии · '+inStock+' шт.':'Нет в наличии'}</span></div><div class="sizes">${p.sizes.map(s=>`<button class="size ${state.size===s?'active':''}" onclick="chooseSize('${s}')">${s}</button>`).join('')}</div><div class="meta-list"><div class="meta-row"><b>Получение</b><span>Шоурум / доставка</span></div><div class="meta-row"><b>Статус</b><span>${inStock?'Готов к заказу':'Ожидается поставка'}</span></div></div></div><div class="buybar"><select class="size-select" onchange="chooseSize(this.value)">${p.sizes.map(s=>`<option ${state.size===s?'selected':''}>${s}</option>`).join('')}</select><button class="primary" ${inStock?'':'disabled'} onclick="addToCart()">Добавить · ${money(p.price)}</button></div>`}
function cart(){let total=0;const rows=state.cart.map(c=>{const p=products.find(x=>x.id===c.productId);if(!p)return'';total+=p.price*c.qty;return `<div class="cart-row"><div class="cart-thumb"><img src="${p.photo}" alt="${p.name}"></div><div><h3>${p.name}</h3><p>${p.brand}<br>Размер ${c.size}</p><div class="qtyline"><div class="stepper"><button onclick="qty('${c.key}',-1)">−</button><b>${c.qty}</b><button onclick="qty('${c.key}',1)">+</button></div><button class="remove" onclick="removeCart('${c.key}')">Удалить</button></div></div><div class="row-price">${money(p.price*c.qty)}</div></div>`}).join('');return `${topbar()}<div class="page-title"><div class="kicker">Заказ</div><h1>Корзина</h1></div>${state.cart.length?`<div class="cart-list">${rows}</div><div class="summary"><div class="sumrow"><span>Товары</span><span>${money(total)}</span></div><div class="sumrow"><span>Доставка</span><span>Уточнит менеджер</span></div><div class="sumrow total"><span>Итого</span><span>${money(total)}</span></div></div><div class="checkoutbar"><button class="primary" onclick="checkout()">Оформить заказ</button></div>`:`<div class="empty">${I.empty}<b>Корзина пуста</b>Выберите товар и размер в каталоге — здесь можно менять количество и удалить позицию.</div>`}`}
function success(){return `${topbar()}<div class="success"><div class="success-mark">${I.check}</div><div class="kicker">Заказ принят</div><h1>Готово</h1><p>Заказ уже появился в панели владельца. В реальном Mini App клиент получит подтверждение в Telegram.</p><div class="order-id">${state.lastOrderId||''}</div><div class="success-actions"><button class="primary" onclick="switchOwnerOrders()">Посмотреть как владелец</button><button class="primary light" onclick="goShop('catalog')">Вернуться в каталог</button></div></div>`}
function profile(){const name=[tgUser.first_name,tgUser.last_name].filter(Boolean).join(' ')||'Покупатель';const uname=tgUser.username?'@'+tgUser.username:'Telegram';const initials=(name.trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2)||'TG').toUpperCase();const ownOrders=state.orders.slice().reverse().slice(0,3);const spent=state.orders.reduce((s,o)=>s+(o.total||0),0);return `${topbar()}<div class="profile-wrap"><div class="profile-hero"><div class="profile-avatar">${tgUser.photo_url?`<img src="${tgUser.photo_url}" alt="${name}">`:initials}</div><div class="profile-meta"><h1>${name}</h1><p>${uname} · авторизация через Telegram</p></div><span class="tg-pill">TG</span></div><div class="profile-stats"><div class="profile-stat"><b>${state.orders.length}</b><span>заказов</span></div><div class="profile-stat"><b>${state.cart.reduce((s,x)=>s+x.qty,0)}</b><span>в корзине</span></div><div class="profile-stat"><b>${spent?Math.round(spent/1000)+'k':'0'}</b><span>покупки ₽</span></div></div><div class="profile-block"><h2>Последние заказы</h2>${ownOrders.length?ownOrders.map(o=>`<div class="mini-order"><div class="mini-order-top"><b>#${o.id} · ${orderLabel(o)}</b><span>${o.status}</span></div><p>${o.items.reduce((s,x)=>s+x.qty,0)} поз. · ${money(o.total)}</p></div>`).join(''):`<div class="mini-order"><p>Заказов пока нет.</p></div>`}</div><div class="profile-block"><h2>Покупателю</h2><button class="profile-row" onclick="goShop('cart')"><span class="profile-row-main"><b>Корзина</b><small>${state.cart.length?'Товаров: '+state.cart.reduce((s,x)=>s+x.qty,0):'Пока пусто'}</small></span><span class="profile-arrow">→</span></button><button class="profile-row" onclick="toast('Открываем чат с магазином')"><span class="profile-row-main"><b>Связаться с магазином</b><small>Написать менеджеру в Telegram</small></span><span class="profile-arrow">→</span></button><button class="profile-row" onclick="toast('Москва · Ленинградский проспект 60а')"><span class="profile-row-main"><b>Шоурум</b><small>Москва, Ленинградский проспект 60а</small></span><span class="profile-arrow">→</span></button></div><div class="profile-note"><b>Mini App:</b> отдельная регистрация не нужна — имя и Telegram ID приходят из Telegram. На сервере ID используется для истории заказов и доступа к личному кабинету.</div></div>`}
function navShop(){const v=state.shop;return `<button class="nav ${v==='home'?'active':''}" onclick="goShop('home')">${I.home}<span>Главная</span></button><button class="nav ${v==='catalog'||v==='detail'?'active':''}" onclick="goShop('catalog')">${I.grid}<span>Каталог</span></button><button class="nav ${v==='cart'?'active':''}" onclick="goShop('cart')">${I.bag}<span>Корзина</span></button><button class="nav ${v==='profile'?'active':''}" onclick="goShop('profile')">${I.user}<span>Профиль</span></button>`}
function ownerTop(title,kicker){return `<header class="top"><div><div class="kicker">${kicker}</div><div class="brand" style="margin-top:3px">${title}</div></div><div class="top-actions"><button class="round" onclick="toast('Поиск по системе')">${I.search}</button></div></header>`}
function dash(){return `${ownerTop('FUSION','Управление')}<div class="owner-head"><div class="kicker">5 октября</div><h1>Добрый день,<br>Максим</h1><p>Склад, поставки и продажи в одном месте.</p></div><div class="integrations"><span class="integration"><i class="dot"></i>Telegram</span><span class="integration"><i class="dot"></i>Avito</span><span class="integration"><i class="dot"></i>TTK</span></div><div class="stats"><div class="stat"><b>${Object.values(state.stocks).reduce((a,b)=>a+b,0)}</b><span>на складе</span></div><div class="stat"><b>18</b><span>в пути</span></div><div class="stat"><b>${state.orders.filter(o=>o.status==='Новый').length}</b><span>новых</span></div></div><section class="owner-section"><h2>Требует внимания</h2><div class="notice"><div><h3>Saint Laurent SL/61 · 42</h3><p>Осталось ${state.stocks[2]} пары.</p></div><strong>мало</strong></div><div class="notice"><div><h3>TTK #CN42018</h3><p>Поставка Salomon ожидается 12–15 октября.</p></div><span>→</span></div></section><section class="owner-section"><h2>Ближайшие поставки</h2><div class="ship-card"><div class="ship-top"><div><h3>Salomon XT-6 · 3 пары</h3><p>TTK · CN42018</p></div><div class="eta">12–15 окт</div></div><div class="progress"><span style="width:68%"></span></div></div><div class="ship-card"><div class="ship-top"><div><h3>Stone Island · 4 шт.</h3><p>TTK · CN41972</p></div><div class="eta">16–18 окт</div></div><div class="progress"><span style="width:44%"></span></div></div></section>`}
function stockList(){let list=products.filter(p=>(p.brand+' '+p.name).toLowerCase().includes((state.stockQuery||'').toLowerCase()));if(state.stockFilter==='В наличии')list=list.filter(p=>state.stocks[p.id]>0);if(state.stockFilter==='Мало')list=list.filter(p=>state.stocks[p.id]>0&&state.stocks[p.id]<=2);if(state.stockFilter==='Нет')list=list.filter(p=>state.stocks[p.id]===0);return list}
function stock(){const list=stockList();return `${ownerTop('Остатки','Склад')}<div class="searchline"><label class="searchbox">${I.search}<input value="${state.stockQuery||''}" placeholder="SKU, бренд, модель" oninput="setStockSearch(this.value)"></label></div><div class="chips">${['Все','В наличии','Мало','Нет'].map(x=>`<button class="chip ${state.stockFilter===x?'active':''}" onclick="setStockFilter('${x}')">${x}</button>`).join('')}</div><div id="stockList" class="stock-list">${stockRows(list)}</div>`}
function stockRows(list){return list.map(p=>`<div class="stock-row"><div class="stock-photo"><img src="${p.photo}" alt="${p.name}"></div><div><h3>${p.name}</h3><p>${p.brand} · ${p.sizes.join(' / ')}</p></div><div class="stock-count"><button onclick="adjust(${p.id},-1)">−</button><b>${state.stocks[p.id]}</b><button onclick="adjust(${p.id},1)">+</button></div></div>`).join('')}
function shipments(){return `${ownerTop('Поставки','Логистика')}<div class="page-title"><div class="kicker">TTK · CN42018</div><h1>Salomon XT-6</h1></div><div class="timeline"><div class="tl done"><i class="tl-dot"></i><div><b>Заказано</b><p>28 сентября · поставщик подтвердил заказ</p></div></div><div class="tl done"><i class="tl-dot"></i><div><b>Передано перевозчику</b><p>2 октября · Гуанчжоу</p></div></div><div class="tl now"><i class="tl-dot"></i><div><b>В пути</b><p>Сейчас · транзит до Москвы</p></div></div><div class="tl"><i class="tl-dot"></i><div><b>Получение</b><p>Ожидаемо 12–15 октября</p></div></div></div><section class="owner-section"><h2>Остальные поставки</h2><div class="ship-card"><div class="ship-top"><div><h3>Stone Island · 4 шт.</h3><p>TTK · CN41972</p></div><div class="eta">16–18 окт</div></div><div class="progress"><span style="width:44%"></span></div></div><div class="ship-card"><div class="ship-top"><div><h3>Maison Margiela · 2 шт.</h3><p>Avito · #AV-10221</p></div><div class="eta">9 окт</div></div><div class="progress"><span style="width:82%"></span></div></div></section>`}
function orderLabel(o){const first=o.items&&o.items[0];const p=first?products.find(x=>x.id===first.productId):null;return p?`${p.name}${o.items.length>1?' +'+(o.items.length-1):''}`:'Заказ'}
function orders(){return `${ownerTop('Заказы','Продажи')}<div class="chips" style="padding-top:12px"><button class="chip active">Все</button><button class="chip">Новые</button><button class="chip">Подтверждены</button></div><section class="owner-section" style="padding-top:0">${state.orders.slice().reverse().map(o=>`<div class="order-card"><div class="order-top"><b>#${o.id}</b><span class="status">${o.status}</span></div><h3>${orderLabel(o)}</h3><p>${o.items.reduce((s,x)=>s+x.qty,0)} поз. · Telegram Mini App · ${money(o.total)}</p><div class="order-actions">${o.status==='Новый'?`<button class="smallbtn black" onclick="confirmOrder('${o.id}')">Подтвердить</button>`:''}<button class="smallbtn" onclick="toast('Чат с клиентом')">Написать</button></div></div>`).join('')}</section>`}
function navOwner(){const v=state.owner;return `<button class="nav ${v==='dash'?'active':''}" onclick="goOwner('dash')">${I.grid}<span>Обзор</span></button><button class="nav ${v==='stock'?'active':''}" onclick="goOwner('stock')">${I.box}<span>Склад</span></button><button class="nav ${v==='shipments'?'active':''}" onclick="goOwner('shipments')">${I.truck}<span>Поставки</span></button><button class="nav ${v==='orders'?'active':''}" onclick="goOwner('orders')">${I.order}<span>Заказы</span></button>`}
function initTelegram(){try{tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;if(!tg||!tg.initData)return;document.body.classList.add('tg-mode');tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor('#fbfbf8');if(tg.setBackgroundColor)tg.setBackgroundColor('#fbfbf8');if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u)tgUser={...tgUser,...u};if(tg.BackButton&&!tgBackBound){tg.BackButton.onClick(()=>{if(state.mode==='shop'&&state.shop==='detail'){state.shop='catalog'}else if(state.mode==='shop'&&['cart','profile','success'].includes(state.shop)){state.shop='home'}else if(state.mode==='owner'&&state.owner!=='dash'){state.owner='dash'}else{return}save();render()});tgBackBound=true}}catch(e){console.warn('Telegram init skipped',e)}}
function updateTelegramChrome(){if(!tg||!tg.BackButton)return;const nested=state.mode==='shop'?['detail','cart','profile','success'].includes(state.shop):state.owner!=='dash';nested?tg.BackButton.show():tg.BackButton.hide()}
function haptic(type='light'){try{if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred(type)}catch(e){}}
function render(){closeFilters(false);const s=document.getElementById('screen'),b=document.getElementById('bottom');document.getElementById('shopMode').classList.toggle('active',state.mode==='shop');document.getElementById('ownerMode').classList.toggle('active',state.mode==='owner');if(state.mode==='shop'){s.innerHTML=state.shop==='home'?home():state.shop==='catalog'?catalog():state.shop==='detail'?detail():state.shop==='cart'?cart():state.shop==='success'?success():profile();b.innerHTML=navShop();b.style.display=state.shop==='detail'?'none':'grid'}else{s.innerHTML=state.owner==='dash'?dash():state.owner==='stock'?stock():state.owner==='shipments'?shipments():orders();b.innerHTML=navOwner();b.style.display='grid'}updateTelegramChrome();s.scrollTop=0}
function openFilters(){const brands=[...new Set(products.map(p=>p.brand))],sizes=[...new Set(products.flatMap(p=>p.sizes))];document.getElementById('sheetHost').innerHTML=`<div class="sheet-backdrop" onclick="if(event.target===this)closeFilters()"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2>Фильтры</h2><button class="close" onclick="closeFilters()">${I.close}</button></div><div class="filter-block"><div class="filter-label"><b>Сортировка</b></div><div class="choices">${[['featured','По умолчанию'],['priceAsc','Сначала дешевле'],['priceDesc','Сначала дороже']].map(([v,l])=>`<button class="choice ${state.filters.sort===v?'on':''}" onclick="setSort('${v}')">${l}</button>`).join('')}</div></div><div class="filter-block"><div class="filter-label"><b>Бренд</b><span>${state.filters.brands.length?state.filters.brands.length+' выбрано':'любой'}</span></div><div class="choices">${brands.map(x=>`<button class="choice ${state.filters.brands.includes(x)?'on':''}" onclick="toggleBrand('${x.replaceAll("'","\\'")}')">${x}</button>`).join('')}</div></div><div class="filter-block"><div class="filter-label"><b>Размер</b><span>${state.filters.sizes.length?state.filters.sizes.length+' выбрано':'любой'}</span></div><div class="choices">${sizes.map(x=>`<button class="choice ${state.filters.sizes.includes(x)?'on':''}" onclick="toggleSize('${x}')">${x}</button>`).join('')}</div></div><div class="filter-block"><div class="filter-label"><b>Цена до</b><span id="priceLabel">${money(state.filters.maxPrice)}</span></div><input class="range" type="range" min="30000" max="100000" step="5000" value="${state.filters.maxPrice}" oninput="setMaxPrice(this.value)"><div class="range-values"><span>30 000 ₽</span><span>100 000 ₽</span></div></div><div class="filter-block"><div class="switchrow"><div class="filter-label" style="margin:0"><b>Только в наличии</b></div><button class="switch ${state.filters.inStock?'on':''}" onclick="toggleInStock()"><i></i></button></div></div><div class="sheet-actions"><button class="primary light" onclick="resetFilters()">Сбросить</button><button class="primary" onclick="applyFilters()">Показать ${filteredProducts().length}</button></div></div></div>`}
function refreshSheet(){openFilters()}
function closeFilters(){document.getElementById('sheetHost').innerHTML=''}
window.goShop=v=>{state.shop=v;save();render()};window.goOwner=v=>{state.owner=v;save();render()};
window.openProduct=id=>{const p=products.find(x=>x.id===id);state.selected=id;state.size=p.sizes[0];state.shop='detail';save();render()};
window.chooseSize=s=>{state.size=s;save();if(state.shop==='detail')render()};
window.setCategory=(c)=>{state.category=c;state.shop='catalog';save();render()};
window.setSearch=q=>{state.query=q;save();const list=filteredProducts(),grid=document.getElementById('catalogGrid'),count=document.getElementById('resultCount');if(grid)grid.innerHTML=list.length?list.map(productCard).join(''):`<div class="empty" style="grid-column:1/-1;padding:56px 18px"><b>Ничего не найдено</b>Сбросьте часть фильтров или измените запрос.</div>`;if(count)count.textContent=list.length+' '+(list.length===1?'товар':'товаров')};
window.addToCart=()=>{haptic('light');const p=products.find(x=>x.id===state.selected);if(!p||!state.stocks[p.id])return;const existing=state.cart.find(x=>x.productId===p.id&&x.size===state.size);if(existing)existing.qty++;else state.cart.push({key:String(Date.now()),productId:p.id,size:state.size,qty:1});save();toast('Добавлено в корзину');setTimeout(()=>{state.shop='cart';render()},320)};
window.qty=(key,d)=>{const i=state.cart.find(x=>x.key===String(key));if(!i)return;i.qty=Math.max(1,i.qty+d);save();render()};
window.removeCart=key=>{state.cart=state.cart.filter(x=>x.key!==String(key));save();render()};
window.checkout=()=>{if(!state.cart.length)return;haptic('medium');const items=state.cart.map(x=>({...x}));const total=items.reduce((sum,i)=>{const p=products.find(x=>x.id===i.productId);return sum+(p?p.price*i.qty:0)},0);const id='F'+(1048+state.orders.length);state.orders.push({id,items,total,status:'Новый'});items.forEach(i=>state.stocks[i.productId]=Math.max(0,(state.stocks[i.productId]||0)-i.qty));state.cart=[];state.lastOrderId='#'+id;state.shop='success';save();render()};
window.switchOwnerOrders=()=>{state.mode='owner';state.owner='orders';save();render()};
window.adjust=(id,d)=>{state.stocks[id]=Math.max(0,(state.stocks[id]||0)+d);save();render();toast('Остаток обновлён')};
window.setStockSearch=q=>{state.stockQuery=q;save();const el=document.getElementById('stockList');if(el)el.innerHTML=stockRows(stockList())};window.setStockFilter=x=>{state.stockFilter=x;save();render()};
window.confirmOrder=id=>{haptic('light');const o=state.orders.find(x=>x.id===id);if(o)o.status='Подтверждён';save();render();toast('Заказ подтверждён')};
window.toggleBrand=x=>{state.filters.brands=state.filters.brands.includes(x)?state.filters.brands.filter(v=>v!==x):[...state.filters.brands,x];save();refreshSheet()};
window.toggleSize=x=>{state.filters.sizes=state.filters.sizes.includes(x)?state.filters.sizes.filter(v=>v!==x):[...state.filters.sizes,x];save();refreshSheet()};
window.setMaxPrice=v=>{state.filters.maxPrice=Number(v);save();document.getElementById('priceLabel').textContent=money(state.filters.maxPrice);const btn=document.querySelector('.sheet-actions .primary:last-child');if(btn)btn.textContent='Показать '+filteredProducts().length};
window.toggleInStock=()=>{state.filters.inStock=!state.filters.inStock;save();refreshSheet()};window.setSort=v=>{state.filters.sort=v;save();refreshSheet()};
window.resetFilters=()=>{state.filters={...defaults.filters};save();refreshSheet()};window.applyFilters=()=>{closeFilters();render()};
document.getElementById('shopMode').onclick=()=>{state.mode='shop';save();render()};document.getElementById('ownerMode').onclick=()=>{state.mode='owner';save();render()};
initTelegram();
render();
</script>
</body>
</html>
